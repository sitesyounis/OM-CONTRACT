<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oman Contract AI Assistant</title>
    <style>
        /* --- STYLES --- */
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --primary: #059669;
            --primary-dark: #047857;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --user-msg: #059669;
            --ai-msg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--card);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
        }

        .brand { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
        .icon { 
            background: var(--primary); 
            color: white; 
            width: 40px; 
            height: 40px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold;
        }

        .title h1 { font-size: 1.1rem; font-weight: 700; }
        .title p { font-size: 0.7rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }

        .badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 99px;
            background: #fee2e2;
            color: #991b1b;
            font-weight: 600;
        }
        .badge.ok { background: #d1fae5; color: #065f46; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background: #f8fafc;
        }

        .msg { display: flex; gap: 0.75rem; max-width: 85%; align-items: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            white-space: pre-wrap;
        }

        .user .bubble { background: var(--user-msg); color: white; border-top-right-radius: 0; }
        .ai .bubble { background: white; border: 1px solid var(--border); border-top-left-radius: 0; }

        footer { padding: 1.25rem; border-top: 1px solid var(--border); background: white; }
        
        .input-box { display: flex; gap: 0.75rem; }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: var(--primary-dark); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .dots { display: flex; gap: 4px; padding: 10px 0; }
        .dot { width: 6px; height: 6px; background: #cbd5e1; border-radius: 50%; animation: b 1.4s infinite; }
        @keyframes b { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        #debug {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            background: #1e293b;
            color: #4ade80;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.7rem;
            max-height: 200px;
            overflow: auto;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand" onclick="toggleDebug()">
                <div class="icon">OM</div>
                <div class="title">
                    <h1>Oman Contract AI</h1>
                    <p>Standard Contract 2019</p>
                </div>
            </div>
            <div id="status" class="badge">Key Required</div>
        </header>

        <main id="chat">
            <div class="msg ai">
                <div class="bubble">Welcome. I can help you with questions about the Sultanate of Oman Standard Contract for Building and Civil Engineering Works (May 2019).

Please ensure your Gemini API Key is added to the script section of this file.</div>
            </div>
        </main>

        <div id="debug">--- System Logs ---<br></div>

        <footer>
            <div class="input-box">
                <input type="text" id="input" placeholder="Ask a question..." autocomplete="off">
                <button id="send">Send</button>
            </div>
        </footer>
    </div>

    <script>
        /* --- CONFIGURATION --- */
        // 1. Get your key from https://aistudio.google.com/
        // 2. Paste it between the quotes below:
        const API_KEY = 'YOUR_API_KEY_HERE';

        const CONTEXT = `
        SULTANATE OF OMAN - STANDARD CONTRACT FOR BUILDING AND CIVIL ENGINEERING WORKS (May 2019)
        Key Provisions:
        - 1.1 Definitions: Employer, Contractor, Engineer, Works, Time for Completion.
        - 4.1 Obligations: Contractor must design, execute, complete works and fix defects.
        - 4.2 Performance Bond: Required for proper performance.
        - 8.7 Delay Penalties: Applied if completion is late.
        - 14.2 Advance Payment: Interest-free loan for mobilisation.
        - 21.1 Force Majeure: Exceptional events like war or natural disasters.
        - 22.1 Claims: Contractor must notify Engineer within 10 days of event.
        `;

        /* --- LOGIC --- */
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');

        function log(msg) {
            debug.innerHTML += `> ${msg}<br>`;
            debug.scrollTop = debug.scrollHeight;
        }

        function toggleDebug() {
            debug.style.display = debug.style.display === 'block' ? 'none' : 'block';
        }

        if (API_KEY !== 'YOUR_API_KEY_HERE') {
            status.textContent = 'Ready';
            status.className = 'badge ok';
            log('API Key detected.');
        } else {
            log('Warning: API Key is missing.');
        }

        function addMsg(role, text) {
            const d = document.createElement('div');
            d.className = `msg ${role}`;
            d.innerHTML = `<div class="bubble">${text}</div>`;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        async function ask(q) {
            if (API_KEY === 'YOUR_API_KEY_HERE') return "Please add your API Key to the index.html file to use the assistant.";
            
            log(`Sending request to Gemini...`);
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Context: ${CONTEXT}\n\nUser: ${q}\n\nAssistant: Answer based ONLY on the context above. If not found, say you don't know.` }] }]
                    })
                });
                const data = await res.json();
                log(`Response received.`);
                if (data.error) return `Error: ${data.error.message}`;
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                log(`Fetch error: ${e.message}`);
                return "Connection error. Check your key and internet.";
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            
            addMsg('user', val);
            input.value = '';
            input.disabled = true;
            send.disabled = true;

            const loading = document.createElement('div');
            loading.className = 'msg ai';
            loading.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            const reply = await ask(val);
            loading.remove();
            addMsg('ai', reply);

            input.disabled = false;
            send.disabled = false;
            input.focus();
        }

        send.onclick = handle;
        input.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
        log('System initialized.');
    </script>
</body>
</html>
