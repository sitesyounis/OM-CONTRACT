<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oman Contract Assistant</title>
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #059669;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .container { width: 100%; max-width: 800px; height: 100%; display: flex; flex-direction: column; background: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .icon { background: var(--primary); color: white; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .badge { font-size: 0.65rem; padding: 4px 10px; border-radius: 99px; background: #e2e8f0; font-weight: 600; }
        .badge.ok { background: #d1fae5; color: #065f46; }
        #chat { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: #f8fafc; }
        .msg { display: flex; gap: 0.75rem; max-width: 85%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 0.8rem 1rem; border-radius: 1rem; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.05); white-space: pre-wrap; }
        .user .bubble { background: var(--primary); color: white; border-top-right-radius: 0; }
        .ai .bubble { background: white; border: 1px solid var(--border); border-top-left-radius: 0; }
        footer { padding: 1rem; border-top: 1px solid var(--border); }
        .input-box { display: flex; gap: 0.75rem; }
        input { flex: 1; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.75rem; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 1.5rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .dots { display: flex; gap: 4px; padding: 10px 0; }
        .dot { width: 6px; height: 6px; background: #cbd5e1; border-radius: 50%; animation: b 1.4s infinite; }
        @keyframes b { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="icon">OM</div>
                <div class="title"><h1>Oman Contract AI</h1><p style="font-size:0.7rem;color:#64748b">Standard Contract 2019</p></div>
            </div>
            <div id="status" class="badge">Initializing...</div>
        </header>
        <main id="chat">
            <div class="msg ai"><div class="bubble">Welcome! I am your AI Assistant for the Oman Standard Contract (2019). I will automatically detect the best AI model for your key.</div></div>
        </main>
        <footer>
            <div class="input-box">
                <input type="text" id="input" placeholder="Ask a question..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </footer>
    </div>

    <script>
        const API_KEY = 'AIzaSyC7AWLq8dOHGOYl3HwrcHjFEDRnWVYo3AA';
        const CONTEXT = `
        SULTANATE OF OMAN - STANDARD CONTRACT FOR BUILDING AND CIVIL ENGINEERING WORKS (May 2019)
        - Clause 1.1: Definitions (Employer, Contractor, Engineer, Works).
        - Clause 4.1: Contractor's Obligations (Design, execute, complete works).
        - Clause 4.2: Performance Bond required.
        - Clause 8.7: Delay Penalties for late completion.
        - Clause 14.2: Advance Payment (interest-free).
        - Clause 21.1: Force Majeure (war, natural disasters).
        - Clause 22.1: Claims must be notified within 10 days.
        `;

        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const status = document.getElementById('status');

        let activeModel = 'gemini-1.5-flash';
        let apiVersion = 'v1beta';

        function addMsg(role, text) {
            const d = document.createElement('div');
            d.className = `msg ${role}`;
            d.innerHTML = `<div class="bubble">${text}</div>`;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        // --- AUTO-DISCOVERY ---
        async function discoverModel() {
            const versions = ['v1beta', 'v1'];
            for (const v of versions) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/${v}/models?key=${API_KEY}`);
                    const data = await res.json();
                    if (data.models) {
                        const flash = data.models.find(m => m.name.includes('flash'));
                        if (flash) {
                            activeModel = flash.name.split('/').pop();
                            apiVersion = v;
                            status.textContent = `Online (${activeModel})`;
                            status.className = 'badge ok';
                            return true;
                        }
                    }
                } catch (e) {}
            }
            status.textContent = 'Offline (Local Mode)';
            return false;
        }

        async function askAI(q) {
            const url = `https://generativelanguage.googleapis.com/${apiVersion}/models/${activeModel}:generateContent?key=${API_KEY}`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Context: ${CONTEXT}\n\nUser: ${q}\n\nAssistant: Answer based ONLY on the context. If not found, say you don't know.` }] }]
                    })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                console.error(e);
                // Fallback to local search
                return localSearch(q);
            }
        }

        function localSearch(q) {
            const query = q.toLowerCase();
            if (query.includes('penalty') || query.includes('delay')) return "According to Clause 8.7, Delay Penalties are applied if the Contractor fails to complete the works within the Time for Completion.";
            if (query.includes('payment') || query.includes('advance')) return "Clause 14.2 states that the Employer shall make an interest-free advance payment for mobilisation.";
            if (query.includes('force majeure')) return "Clause 21.1 defines Force Majeure as exceptional events beyond a Party's control, such as war or natural catastrophes.";
            return "I'm currently in Local Search mode. I found that the contract covers Definitions (1.1), Obligations (4.1), Bonds (4.2), Penalties (8.7), and Payments (14.2). Please try rephrasing your question.";
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            addMsg('user', val);
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;

            const loading = document.createElement('div');
            loading.className = 'msg ai';
            loading.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            const reply = await askAI(val);
            loading.remove();
            addMsg('ai', reply);

            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.onclick = handle;
        input.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
        discoverModel();
    </script>
</body>
</html>
